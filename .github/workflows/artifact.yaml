name: artifacts
on:
  workflow_dispatch:
jobs:
  artifact-producer:
    name: producer-artifact
    runs-on: ubuntu-latest
    steps:
      - name: create-artifact
        run: |
          echo "This is an artifact file created and stored as this content!" >> artifact.txt
          echo "Generated this artifact at {$date}" >> artifact.txt

      - name: upload-artifact
        uses: actions/upload-artifact@v7
        with: 
          name: artifact
          path: artifact.txt

  artifact-consumer:
    name: consumer-artifact
    runs-on: ubuntu-latest
    needs: artifact-producer
    steps: 
      - name: download-artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact
        
      - name: cat artifact file
        run: | 
          cat artifact.txt
